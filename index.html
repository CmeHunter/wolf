<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0d1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="狼人殺小幫手">
<title>狼人殺小幫手 v2026.5.19</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Lexend:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a14;
    --bg2: #11111f;
    --bg3: #1a1a2e;
    --gold: #c9a84c;
    --gold2: #e8c96a;
    --red: #c0392b;
    --red2: #e74c3c;
    --blue: #2980b9;
    --blue2: #3498db;
    --text: #e8e0d0;
    --text2: #a09070;
    --border: #2a2a40;
    --card: #141428;
    --accent: #7b3f8c;
    --accent2: #9b5fb0;
    --green: #27ae60;
    --green2: #2ecc71;
    --font-ui: 'Noto Sans TC', sans-serif;
    --font-num: 'Lexend', 'Noto Sans TC', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 20px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 20% 20%, rgba(123,63,140,0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 80%, rgba(201,168,76,0.08) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    animation: twinkle var(--d, 3s) ease-in-out infinite var(--delay, 0s);
    opacity: 0;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0; }
    50% { opacity: var(--op, 0.6); }
  }

  #app { position: relative; z-index: 1; min-height: 100vh; }

  /* ======= SCREENS ======= */
  .screen { display: none; min-height: 100vh; flex-direction: column; }
  .screen.active { display: flex; }

  /* ======= HOME ======= */
  #home {
    padding: 40px 20px 0;
    align-items: center;
  }

  .home-shell {
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .home-title {
    text-align: center;
    margin-bottom: 50px;
  }

  .home-title .moon {
    font-size: 56px;
    display: block;
    margin-bottom: 8px;
    animation: moonFloat 4s ease-in-out infinite;
  }

  @keyframes moonFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .home-title h1 {
    font-family: var(--font-ui);
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 4px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .home-title h2 {
    font-size: 40px;
    font-weight: 900;
    letter-spacing: 1px;
    line-height: 1.2;
    color: var(--text);
    text-shadow: 0 0 30px rgba(201,168,76,0.3);
  }

  .app-version {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-top: 22px;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid rgba(201,168,76,0.35);
    background: rgba(201,168,76,0.08);
    color: var(--gold2);
    font-family: var(--font-num);
    font-size: 18px;
    letter-spacing: 1px;
  }

  .screen-footer {
    width: 100%;
    padding: 18px 20px 24px;
    text-align: center;
    font-size: 16px;
    color: var(--text2);
    letter-spacing: 1px;
  }

  .menu-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    width: 100%;
    max-width: 388px;
  }

  .menu-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 18px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .menu-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--card-glow, transparent);
    opacity: 0;
    transition: opacity 0.3s;
    border-radius: 16px;
  }

  .menu-card:active { transform: scale(0.96); }
  .menu-card:active::before { opacity: 1; }

  .menu-card .icon { margin-bottom: 12px; display: block; }
  .menu-icon-image {
    width: 56px;
    height: 56px;
    object-fit: cover;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow: 0 8px 24px rgba(0,0,0,0.28);
  }
  .menu-card .label { font-size: 20px; font-weight: 700; color: var(--text); }
  .menu-card .sub { font-size: 16px; color: var(--text2); margin-top: 6px; }

  .menu-card:nth-child(1) { --card-glow: radial-gradient(circle, rgba(201,168,76,0.15), transparent); border-color: rgba(201,168,76,0.2); }
  .menu-card:nth-child(2) { --card-glow: radial-gradient(circle, rgba(41,128,185,0.15), transparent); border-color: rgba(41,128,185,0.2); }
  .menu-card:nth-child(3) { --card-glow: radial-gradient(circle, rgba(123,63,140,0.15), transparent); border-color: rgba(123,63,140,0.2); }
  .menu-card:nth-child(4) { --card-glow: radial-gradient(circle, rgba(39,174,96,0.15), transparent); border-color: rgba(39,174,96,0.2); }

  /* ======= SCREEN HEADER ======= */
  .screen-header {
    display: flex;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(10,10,20,0.8);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .back-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 8px 14px;
    border-radius: 20px;
    font-family: var(--font-ui);
    font-size: 17px;
    cursor: pointer;
    transition: all 0.2s;
    margin-right: 16px;
    flex-shrink: 0;
  }
  .back-btn:active { background: var(--border); }

  .screen-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--gold);
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .screen-title-icon {
    width: 28px;
    height: 28px;
    object-fit: cover;
    border-radius: 9px;
    border: 1px solid rgba(255,255,255,0.18);
    flex-shrink: 0;
  }

  .settings-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 8px 12px;
    border-radius: 20px;
    font-size: 20px;
    cursor: pointer;
    transition: all 0.2s;
  }

  /* ======= TIMER SCREEN ======= */
  .timer-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 44px 20px 30px;
  }

  .timer-circle-wrap {
    position: relative;
    width: 260px;
    height: 260px;
    margin-bottom: 30px;
  }

  .timer-svg {
    width: 260px;
    height: 260px;
    transform: rotate(-90deg);
  }

  .timer-track { fill: none; stroke: var(--border); stroke-width: 8; }
  .timer-prog {
    fill: none;
    stroke: var(--gold);
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.5s linear, stroke 0.3s;
  }

  .timer-inner {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .timer-number {
    font-family: Arial, sans-serif;
    font-size: 112px;
    font-weight: 900;
    letter-spacing: 1px;
    color: var(--text);
    line-height: 1;
    transition: color 0.3s;
  }

  .timer-number.warning { color: var(--red2); text-shadow: 0 0 20px rgba(231,76,60,0.5); }

  .timer-label {
    font-size: 18px;
    color: var(--text2);
    letter-spacing: 1px;
    font-weight: 700;
    margin-top: 6px;
  }

  .timer-controls {
    display: flex;
    gap: 12px;
    margin-bottom: 14px;
    width: 100%;
    max-width: 388px;
    flex-wrap: wrap;
  }

  .timer-btn-wide {
    flex: 1 1 160px;
  }

  .timer-quick-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    width: 100%;
    max-width: 388px;
    margin-bottom: 14px;
  }

  .timer-quick-row > * {
    flex: 1 1 140px;
  }

  .timer-preset-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    width: 100%;
    max-width: 388px;
    margin-bottom: 24px;
  }

  .timer-preset-btn {
    flex: 1 1 140px;
  }

  .timer-preset-btn.active {
    background: var(--gold);
    color: #000;
    border-color: var(--gold);
  }

  .btn {
    padding: 16px 30px;
    border-radius: 50px;
    border: none;
    font-family: var(--font-ui);
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
  }

  .btn:active { transform: scale(0.95); }
  .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .btn-primary { background: var(--gold); color: #000; }
  .btn-primary:active { background: var(--gold2); }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-danger:active { background: var(--red2); }
  .btn-secondary { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
  .btn-blue { background: var(--blue); color: #fff; }
  .btn-green { background: var(--green); color: #fff; }
  .btn-purple { background: var(--accent); color: #fff; }
  .btn-sm { padding: 13px 20px; font-size: 18px; }

  /* Extra time panel */
  .extra-time-panel {
    width: 100%;
    max-width: 360px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    display: none;
  }

  .extra-time-panel.visible { display: block; }

  .panel-title {
    font-size: 20px;
    color: var(--gold);
    font-weight: 800;
    margin-bottom: 14px;
    letter-spacing: 1px;
  }

  .number-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .num-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 0;
    font-family: var(--font-num);
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }

  .num-btn.selected {
    background: var(--gold);
    color: #000;
    border-color: var(--gold);
  }

  .num-btn:active { transform: scale(0.93); }

  .extra-action-row,
  .panel-action-row,
  .exclude-action-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    width: 100%;
  }

  .extra-action-row > *,
  .panel-action-row > *,
  .exclude-action-row > * {
    flex: 1 1 140px;
  }

  .panel-action-row {
    margin-top: 16px;
    margin-bottom: 18px;
  }

  .speaker-panel {
    width: 100%;
    max-width: 360px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 18px;
  }

  .mode-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 16px;
    margin-bottom: 14px;
  }

  .mode-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text2);
    border-radius: 10px;
    padding: 10px 12px;
    font-family: var(--font-ui);
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }

  .mode-btn.active {
    background: var(--gold);
    color: #000;
    border-color: var(--gold);
  }

  .speaker-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .speaker-card {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 10px;
    color: var(--text);
    display: flex;
    flex-direction: column;
    gap: 8px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
  }

  .speaker-card.selected {
    border-color: var(--gold);
    box-shadow: 0 0 0 1px rgba(201,168,76,0.35);
    background: rgba(201,168,76,0.12);
  }

  .speaker-card:active {
    transform: scale(0.97);
  }

  .speaker-card-number {
    font-size: 19px;
    font-weight: 800;
    color: var(--text);
  }

  .speaker-card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--text2);
    font-size: 16px;
  }

  .speaker-count {
    font-family: var(--font-num);
    font-size: 32px;
    color: var(--gold);
    line-height: 1;
  }

  /* ======= SETTINGS MODAL ======= */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }

  .modal-overlay.active { display: flex; }

  .modal-sheet {
    background: var(--bg2);
    border-radius: 24px 24px 0 0;
    padding: 24px 20px 40px;
    width: 100%;
    max-width: 480px;
    border-top: 1px solid var(--border);
    animation: slideUp 0.3s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal-handle {
    width: 40px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 20px;
  }

  .modal-title {
    font-size: 20px;
    font-weight: 800;
    color: var(--gold);
    margin-bottom: 20px;
    text-align: center;
  }

  .form-row {
    display: flex;
    align-items: center;
    margin-bottom: 16px;
    gap: 12px;
  }

  .form-label {
    font-size: 17px;
    font-weight: 600;
    color: var(--text2);
    flex: 1;
  }

  .form-input {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 10px;
    font-family: var(--font-num);
    font-size: 20px;
    width: 120px;
    text-align: center;
    -webkit-appearance: none;
  }

  .form-input:focus { outline: none; border-color: var(--gold); }

  /* ======= DRAW SCREEN ======= */
  .draw-content {
    flex: 1;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .exclude-section {
    width: 100%;
    max-width: 360px;
    margin-bottom: 20px;
  }

  .section-label {
    font-size: 15px;
    color: var(--text2);
    margin-bottom: 10px;
    letter-spacing: 1px;
  }

  .result-card {
    width: 100%;
    max-width: 360px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 30px 20px;
    text-align: center;
    margin-bottom: 24px;
    min-height: 156px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .result-card-icon {
    width: 68px;
    height: 68px;
    object-fit: cover;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.16);
    box-shadow: 0 10px 28px rgba(0,0,0,0.28);
  }

  .result-big {
    font-family: var(--font-num);
    font-size: 92px;
    font-weight: 900;
    color: var(--gold);
    text-shadow: 0 0 40px rgba(201,168,76,0.4);
    line-height: 1;
  }

  .result-sub {
    font-size: 24px;
    color: var(--text2);
    margin-top: 8px;
  }

  .result-tag {
    display: inline-block;
    background: rgba(201,168,76,0.15);
    border: 1px solid rgba(201,168,76,0.3);
    color: var(--gold);
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 17px;
    font-weight: 700;
    margin-top: 10px;
  }

  .order-toggle {
    display: flex;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
    width: 100%;
    max-width: 360px;
  }

  .order-btn {
    flex: 1;
    padding: 12px;
    background: var(--bg3);
    border: none;
    color: var(--text2);
    font-family: var(--font-ui);
    font-size: 17px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .order-btn.active { background: var(--gold); color: #000; font-weight: 700; }

  .layout-content {
    flex: 1;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .layout-result-name {
    font-size: 42px;
    font-weight: 900;
    color: var(--gold);
    line-height: 1.35;
    text-shadow: 0 0 26px rgba(201,168,76,0.3);
  }

  .layout-editor {
    width: 100%;
    max-width: 360px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px;
  }

  .layout-add-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .layout-name-input {
    flex: 1 1 220px;
    width: auto;
    min-width: 0;
    text-align: left;
  }

  #add-layout-btn {
    flex: 0 0 auto;
    white-space: nowrap;
  }

  .layout-pool-list {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 14px;
  }

  .layout-pool-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 14px;
    border-radius: 12px;
    background: var(--bg3);
    border: 1px solid var(--border);
  }

  .layout-pool-name {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
  }

  .layout-remove-btn {
    background: transparent;
    border: 1px solid rgba(231,76,60,0.35);
    color: #ffb1a8;
    border-radius: 999px;
    padding: 6px 12px;
    font-family: var(--font-ui);
    font-size: 15px;
    cursor: pointer;
  }

  .layout-empty {
    padding: 16px 14px;
    border-radius: 12px;
    background: rgba(255,255,255,0.03);
    border: 1px dashed var(--border);
    color: var(--text2);
    text-align: center;
    font-size: 15px;
  }

  /* ======= NIGHT TIMER ======= */
  .night-content {
    flex: 1;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .phase-list {
    width: 100%;
    max-width: 360px;
    margin-bottom: 24px;
  }

  .phase-item {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    border-radius: 12px;
    margin-bottom: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    transition: all 0.3s;
    gap: 12px;
  }

  .phase-item.active {
    background: rgba(123,63,140,0.2);
    border-color: var(--accent2);
  }

  .phase-item.done {
    opacity: 0.4;
  }

  .phase-num {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--bg3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-num);
    font-size: 16px;
    font-weight: 700;
    color: var(--text2);
    flex-shrink: 0;
  }

  .phase-item.active .phase-num {
    background: var(--accent);
    color: #fff;
  }

  .phase-item.done .phase-num {
    background: var(--green);
    color: #fff;
  }

  .phase-info { flex: 1; }
  .phase-name { font-size: 17px; font-weight: 700; color: var(--text); }
  .phase-duration { font-size: 16px; color: var(--text2); }

  .phase-input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    width: 60px;

<script>
// ===== STARS =====
(function() {
  const c = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--delay:${Math.random()*5}s;--op:${0.3+Math.random()*0.7}`;
    c.appendChild(s);
  }
})();

// ===== STATE =====
const LS = {
  get: (k, def) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

const APP_VERSION = 'v2026.5.19';

const { createHistoryRecord, formatHistoryTimestamp } = window.HistoryFormatters;
const {
  createDefaultExtraCounts,
  getTimerAlertStage,
  normalizeExtraCounts,
  normalizeTimerSettings
} = window.TimerUtils;

document.title = `狼人殺小幫手 ${APP_VERSION}`;

// ===== NAVIGATION =====
function goTo(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
  if (id === 'timer-screen') initTimerScreen();
  if (id === 'draw-screen') initDrawScreen();
  if (id === 'night-screen') initNightScreen();
  if (id === 'cards-screen') initCardsScreen();
}

function goBack() {
  timerStop();
  goTo('home');
}

// ===== MODALS =====
function syncTimerSettingsInputs() {
  document.getElementById('set-seconds').value = timerSettings.seconds;
  document.getElementById('set-first-warning').value = timerSettings.firstWarning;
  document.getElementById('set-second-warning').value = timerSettings.secondWarning;
  document.getElementById('set-adjust-secs').value = timerSettings.adjustSecs;
  document.getElementById('set-preset-30-secs').value = timerSettings.preset30Secs;
  document.getElementById('set-preset-60-secs').value = timerSettings.preset60Secs;
  document.getElementById('set-preset-90-secs').value = timerSettings.preset90Secs;
  document.getElementById('set-preset-120-secs').value = timerSettings.preset120Secs;
}

function openModal(id) {
  if (id === 'timer-settings') syncTimerSettingsInputs();
  document.getElementById(id)?.classList.add('active');
}

function closeModal(id) {
  document.getElementById(id)?.classList.remove('active');
}

document.querySelectorAll('.modal-overlay').forEach(o => {
  o.addEventListener('click', e => { if (e.target === o) o.classList.remove('active'); });
});

// ===== AUDIO =====
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function getAudioCtx() {
  if (!AudioCtx) return null;
  if (!audioCtx || audioCtx.state === 'closed') audioCtx = new AudioCtx();
  if ((audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') && typeof audioCtx.resume === 'function') {
    audioCtx.resume().catch(() => {});
  }
  return audioCtx;
}

function wakeAudioCtx() {
  const ctx = getAudioCtx();
  if (!ctx || typeof ctx.resume !== 'function') return;
  if (ctx.state === 'suspended' || ctx.state === 'interrupted') {
    ctx.resume().catch(() => {});
  }
}

function beep(freq, dur, type='sine', vol=0.3) {
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.start(ctx.currentTime);
    o.stop(ctx.currentTime + dur);
  } catch(e) {}
}

function playWarning() {
  beep(880, 0.12, 'square', 0.2);
}

let timerSettings = normalizeTimerSettings({
  ...(LS.get('timerSettings', null) || {}),
  extraSecs: 60
});
LS.set('timerSettings', timerSettings);

function normalizeSelectedNum(saved) {
  const value = parseInt(saved, 10);
  return Number.isFinite(value) && value >= 1 && value <= 12 ? value : null;
}

let timerState = {
  remaining: timerSettings.seconds,
  running: false,
  interval: null,
  extraCounts: normalizeExtraCounts(LS.get('timerExtraCounts', null)),
  selectedNum: normalizeSelectedNum(LS.get('timerSelectedNum', null)),
  adjustMode: LS.get('timerAdjustMode', 'decrease') === 'increase' ? 'increase' : 'decrease',
  alertBase: timerSettings.seconds,
  totalExtra: 0,
  extraHistory: LS.get('extraHistory', [])
};

const CIRCUMFERENCE = 2 * Math.PI * 108; // 678.6

function persistTimerSelectionState() {
  LS.set('timerExtraCounts', timerState.extraCounts);
  LS.set('timerSelectedNum', timerState.selectedNum);
  LS.set('timerAdjustMode', timerState.adjustMode);
}

function initTimerScreen() {
  syncTimerSettingsInputs();
  renderExtraHistory();
  timerReset();
}

function updateTimerControls() {
  const startBtn = document.getElementById('timer-start-btn');
  const pauseBtn = document.getElementById('timer-pause-btn');
  const hasStarted = timerState.remaining < timerSettings.seconds || timerState.totalExtra > 0;

  if (startBtn) {
    startBtn.disabled = timerState.running;
    startBtn.textContent = timerState.running ? '執行中' : (hasStarted ? '繼續' : '開始');
  }

  if (pauseBtn) {
    pauseBtn.disabled = !timerState.running;
  }

  document.querySelectorAll('.timer-preset-btn').forEach((button) => {
    const seconds = parseInt(button.dataset.seconds, 10);
    button.classList.toggle('active', seconds === timerSettings.seconds);
  });
}

function updateAdjustModeButtons() {
  document.getElementById('count-mode-minus').classList.toggle('active', timerState.adjustMode === 'decrease');
  document.getElementById('count-mode-plus').classList.toggle('active', timerState.adjustMode === 'increase');
}

function updateTimerShortcutButtons() {
  const quickAddBtn = document.getElementById('timer-quick-add-btn');
  const quickRestoreBtn = document.getElementById('timer-quick-restore-btn');

  if (quickAddBtn) quickAddBtn.textContent = `增加${timerSettings.adjustSecs}秒`;
  if (quickRestoreBtn) quickRestoreBtn.textContent = `減少${timerSettings.adjustSecs}秒`;
}

function updateTimerPresetButtons() {
  const presetConfigs = [
    ['timer-preset-30', timerSettings.preset30Secs],
    ['timer-preset-60', timerSettings.preset60Secs],
    ['timer-preset-90', timerSettings.preset90Secs],
    ['timer-preset-120', timerSettings.preset120Secs]
  ];

  presetConfigs.forEach(([id, seconds]) => {
    const button = document.getElementById(id);
    if (!button) return;
    button.dataset.seconds = String(seconds);
    button.textContent = `重設${seconds}秒`;
  });
}

function updateInitializeCountsButton() {
  const button = document.getElementById('initialize-counts-btn');
  if (button) button.textContent = '所有號碼重設為1';
}

function updateSelectedNumberText() {}

function setAdjustMode(mode) {
  timerState.adjustMode = mode === 'increase' ? 'increase' : 'decrease';
  persistTimerSelectionState();
  updateAdjustModeButtons();
  updateSelectedNumberText();
}

function initializeExtraCounts() {
  if (!window.confirm('確定要將所有號碼重設為1嗎？')) return;
  timerState.extraCounts = createDefaultExtraCounts();
  persistTimerSelectionState();
  renderSpeakerGrid();
  updateExtraRemainText();
}

function handleSpeakerSelect(num) {
  const current = timerState.extraCounts[num] ?? 1;
  const next = timerState.adjustMode === 'increase' ? current + 1 : Math.max(0, current - 1);
  timerState.selectedNum = num;
  timerState.extraCounts[num] = next;
  persistTimerSelectionState();
  renderSpeakerGrid();
}

function renderSpeakerGrid() {
  const g = document.getElementById('speaker-grid');
  g.innerHTML = '';
  for (let i = 1; i <= 12; i++) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'speaker-card' + (timerState.selectedNum === i ? ' selected' : '');
    b.dataset.num = i;
    b.innerHTML = `<span class="speaker-card-number">${i} 號</span><span class="speaker-card-meta"><span>剩餘</span><span class="speaker-count">${timerState.extraCounts[i]}</span></span>`;
    b.onclick = () => { handleSpeakerSelect(i); };
    g.appendChild(b);
  }
  updateAdjustModeButtons();
  updateSelectedNumberText();
}

function updateTimerDisplay() {
  const s = timerState.remaining;
  const el = document.getElementById('timer-display');
  const prog = document.getElementById('timer-prog');
  const total = timerSettings.seconds + (timerState.totalExtra);
  const ratio = Math.max(0, s / total);
  const offset = CIRCUMFERENCE * (1 - ratio);
  prog.style.strokeDashoffset = offset;

  el.textContent = s;

  const isWarning = s <= timerSettings.firstWarning && s > 0;
  el.classList.toggle('warning', isWarning || s === 0);
  document.getElementById('pulse-ring').classList.toggle('active', s === 0);

  if (s === 0) {
    prog.style.stroke = '#e74c3c';
    document.querySelector('.timer-circle-wrap').classList.add('shaking');
    setTimeout(() => document.querySelector('.timer-circle-wrap').classList.remove('shaking'), 600);
  } else if (isWarning) {
    prog.style.stroke = '#e74c3c';
  } else {
    prog.style.stroke = 'var(--gold)';
  }
}

function timerTick() {
  if (timerState.remaining <= 0) return;
  timerState.remaining--;
  updateTimerDisplay();

  const alertStage = getTimerAlertStage(
    timerState.remaining,
    timerSettings.firstWarning,
    timerSettings.secondWarning,
    timerState.alertBase
  );
  if (alertStage === 'first-warning') playWarning();
  if (alertStage === 'second-warning') playWarning();
  if (alertStage === 'end') {
    playEnd();
    timerStop();
  }
}

function timerStart() {
  if (timerState.running) return;
  if (timerState.remaining <= 0) timerReset();
  getAudioCtx();
  playDrawChime();
  timerState.running = true;
  clearInterval(timerState.interval);
  timerState.interval = setInterval(timerTick, 1000);
  updateTimerControls();
}

function timerPause() {
  if (!timerState.running) return;
  playLayoutChime();
  timerStop();
}

function adjustTimerRemaining(secondsToAdd) {
  secondsToAdd = parseInt(secondsToAdd, 10);
  if (!Number.isFinite(secondsToAdd) || secondsToAdd === 0) return;

  const nextRemaining = Math.max(1, timerState.remaining + secondsToAdd);
  const appliedDelta = nextRemaining - timerState.remaining;
  if (appliedDelta === 0) return;

  timerState.remaining = nextRemaining;
  timerState.totalExtra += appliedDelta;
  timerState.alertBase = Math.max(timerState.alertBase, timerState.remaining);
  closeExtraPanel();
  updateTimerDisplay();
  updateTimerControls();
}

function applyQuickIncreaseTime() {
  adjustTimerRemaining(timerSettings.adjustSecs);
}

function applyQuickDecreaseTime() {
  adjustTimerRemaining(-timerSettings.adjustSecs);
}

function timerToggle() {
  if (timerState.running) {
    timerPause();
  } else {
    timerStart();
  }
}

function timerStop() {
  timerState.running = false;
  clearInterval(timerState.interval);
  timerState.interval = null;
  updateTimerControls();
}

function applyTimerPreset(seconds) {
  seconds = parseInt(seconds, 10);
  if (!Number.isFinite(seconds) || seconds < 1) return;

  timerSettings = normalizeTimerSettings({
    ...timerSettings,
    seconds
  });
  LS.set('timerSettings', timerSettings);
  document.getElementById('set-seconds').value = timerSettings.seconds;
  timerReset();
}

function timerReset() {
  timerStop();
  timerState.remaining = timerSettings.seconds;
  timerState.alertBase = timerSettings.seconds;
  timerState.totalExtra = 0;
  closeExtraPanel();
  updateTimerShortcutButtons();
  updateTimerPresetButtons();
  updateInitializeCountsButton();
  updateTimerDisplay();
  renderSpeakerGrid();
  updateExtraRemainText();
  document.getElementById('pulse-ring').classList.remove('active');
  document.querySelector('.timer-circle-wrap').classList.remove('shaking');
  document.getElementById('timer-prog').style.stroke = 'var(--gold)';
  updateTimerControls();
}

function closeExtraPanel() {
  document.getElementById('extra-panel')?.classList.remove('visible');
}

function updateExtraRemainText() {}

function applyExtraTime() {
  if (!timerState.selectedNum) { alert('請先在上方選擇使用加時的號碼'); return; }

  const nums = [timerState.selectedNum];

  const addSecs = timerSettings.extraSecs;
  timerState.remaining += addSecs;
  timerState.totalExtra += addSecs;
  timerState.alertBase = Math.max(timerState.alertBase, timerState.remaining);

  // history
  const rec = createHistoryRecord({ nums, secs: addSecs });
  timerState.extraHistory.unshift(rec);
  if (timerState.extraHistory.length > 10) timerState.extraHistory.pop();
  LS.set('extraHistory', timerState.extraHistory);

  closeExtraPanel();
  updateTimerDisplay();
  updateExtraRemainText();
  updateSelectedNumberText();
  renderExtraHistory();

  // restart
  document.getElementById('timer-prog').style.stroke = 'var(--gold)';
  document.getElementById('timer-display').classList.remove('warning');
  timerStart();
}

function renderExtraHistory() {
  const el = document.getElementById('extra-history');
  const h = timerState.extraHistory;
  if (!h.length) { el.innerHTML = '<div class="empty-state">尚無紀錄</div>'; return; }
  el.innerHTML = h.map(r => `<div class="history-item"><span>${r.nums.join(', ')} 號</span><span>+${r.secs}秒 ${formatHistoryTimestamp(r.at || r.time)}</span></div>`).join('');
}

function confirmClearHistory(name) {
  return window.confirm(`確定要清除${name}嗎？`);
}

function clearExtraHistory() {
  if (!confirmClearHistory('加時紀錄')) return;
  timerState.extraHistory = [];
  LS.set('extraHistory', timerState.extraHistory);
  renderExtraHistory();
}

function saveTimerSettings() {
  timerSettings = normalizeTimerSettings({
    seconds: document.getElementById('set-seconds').value,
    firstWarning: document.getElementById('set-first-warning').value,
    secondWarning: document.getElementById('set-second-warning').value,

    preset120Secs: document.getElementById('set-preset-120-secs').value
  });
  LS.set('timerSettings', timerSettings);
  closeModal('timer-settings');
  timerReset();
}

function buildExcludeGrid() {
  const g = document.getElementById('exclude-grid');
  g.innerHTML = '';
  for (let i = 1; i <= 12; i++) {
    const b = document.createElement('button');
    b.className = 'num-btn' + (excludedNums.includes(i) ? ' selected' : '');
    b.textContent = i;
    b.style.opacity = excludedNums.includes(i) ? '0.4' : '1';

    b.onclick = () => toggleExclude(i);
    g.appendChild(b);

function setExcludedNums(nums) {
  excludedNums = Array.from(new Set(nums)).sort((a, b) => a - b);
  LS.set('excludedNums', excludedNums);
  buildExcludeGrid();
}

function selectAllDrawNumbers() {
  setExcludedNums([]);
}

function excludeAllDrawNumbers() {
  setExcludedNums(Array.from({ length: 12 }, (_, index) => index + 1));
}

function toggleExclude(n) {
  if (excludedNums.includes(n)) {
    setExcludedNums(excludedNums.filter((num) => num !== n));
    return;
  }

  setExcludedNums([...excludedNums, n]);
}

function doDraw() {
  getAudioCtx();
  const pool = [];
  for (let i = 1; i <= 12; i++) { if (!excludedNums.includes(i)) pool.push(i); }
  if (!pool.length) { alert('所有號碼都被排除了！'); return; }

  const num = pool[Math.floor(Math.random() * pool.length)];
  const orderLabel = Math.random() < 0.5 ? '順序' : '逆序';

  drawCurrentResult = { num, order: orderLabel };
  LS.set('drawCurrentResult', drawCurrentResult);
  renderDrawResult(drawCurrentResult);

  playDrawChime();

  const rec = createHistoryRecord({ num, order: orderLabel });
  drawHistory.unshift(rec);
  if (drawHistory.length > 10) drawHistory.pop();
  LS.set('drawHistory', drawHistory);
  renderDrawHistory();
}

function renderDrawHistory() {
  const el = document.getElementById('draw-history');
  if (!drawHistory.length) { el.innerHTML = '<div class="empty-state">尚無紀錄</div>'; return; }
  el.innerHTML = drawHistory.map(r => `<div class="history-item"><span>${r.num} 號・${r.order}</span><span>${formatHistoryTimestamp(r.at || r.time)}</span></div>`).join('');
}

function clearDrawHistory() {
  if (!confirmClearHistory('抽發言順序紀錄')) return;
  drawCurrentResult = null;
  LS.set('drawCurrentResult', drawCurrentResult);
  drawHistory = [];
  LS.set('drawHistory', drawHistory);
  renderDrawResult();
  renderDrawHistory();
}

const defaultLayoutPresets = ['機械狼通靈師', '百變2.0', '夢魘守衛', '預女獵白混'];

function normalizeLayoutPresets(saved) {
  if (!Array.isArray(saved)) return [...defaultLayoutPresets];
  const cleaned = saved.map((name) => String(name).trim()).filter(Boolean);
  return cleaned.length ? cleaned : [...defaultLayoutPresets];
}
